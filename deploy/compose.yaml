# Single-VM deployment of the table-tennis league platform and pipeline orchestrator (FEAT-00116).
# Usage and prerequisites: deploy/README.md. Variables: deploy/.env.example (copy it to deploy/.env).
#
# Only the proxy publishes ports. PostgreSQL, the platform (8080, management 9090), the orchestrator (8095, with
# /actuator/prometheus) and the ingest service (8091) stay on the internal "backend" network.
name: tt-league

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  logging: *default-logging
  networks:
    - backend

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ttleaguedata
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required, see deploy/.env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/.env.example}
      # Read by deploy/postgres/init/10-pipeline-role.sh on the first start only.
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD:?PIPELINE_DB_PASSWORD is required, see deploy/.env.example}
      TZ: Europe/Madrid
    # The image entrypoint starts as root to prepare the data directory, then drops to the postgres user.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp
      - /var/run/postgresql:mode=1777
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    stop_grace_period: 60s

  api:
    <<: *hardening
    build:
      context: ../tt-data-league-api-runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: tt-league/api-runtime:${IMAGE_TAG:-local}
    environment:
      DB_TTLEAGUEDATA_JDBC_URL: jdbc:postgresql://postgres:5432/ttleaguedata
      DB_TTLEAGUEDATA_CREDENTIAL_USERNAME: ${POSTGRES_USER}
      DB_TTLEAGUEDATA_CREDENTIAL_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?JWT_SIGNING_SECRET is required, see deploy/.env.example}
      PASSWORD_RECOVERY_FROM: ${PASSWORD_RECOVERY_FROM:-no-reply@localhost}
      PASSWORD_RECOVERY_RESET_URL: ${PUBLIC_PLATFORM_URL:-http://localhost:8080}/reset-password
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Service credential of the orchestrator (FEAT-00101): only the key's SHA-256 is configured here.
      SECURITY_SERVICECREDENTIALS_0_NAME: orchestrator
      SECURITY_SERVICECREDENTIALS_0_KEYSHA256: ${ORCHESTRATOR_PLATFORM_API_KEY_SHA256:?ORCHESTRATOR_PLATFORM_API_KEY_SHA256 is required, see deploy/.env.example}
      SECURITY_SERVICECREDENTIALS_0_PERMISSIONS: imports:write,matches:read
      TZ: Europe/Madrid
    tmpfs:
      - /tmp
    volumes:
      - platform-repository:/var/lib/tt-league/repository
    # Also defined in the Dockerfile; repeated here because a podman build in OCI format drops HEALTHCHECK.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9090/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 40s

  ingest:
    <<: *hardening
    build:
      context: ../tt-league-ingest
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: tt-league/ingest:${IMAGE_TAG:-local}
    environment:
      TT_INGEST_REST_API_KEY: ${PIPELINE_INGEST_API_KEY:?PIPELINE_INGEST_API_KEY is required, see deploy/.env.example}
      TZ: Europe/Madrid
    tmpfs:
      - /tmp
    volumes:
      - ingest-data:/var/lib/tt-ingest/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    stop_grace_period: 30s

  orchestrator:
    <<: *hardening
    build:
      context: ../tt-league-pipeline-orchestrator-runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: tt-league/orchestrator-runtime:${IMAGE_TAG:-local}
    environment:
      # The orchestrator connects as the "pipeline" role, which owns only the pipeline schema.
      PIPELINE_DB_URL: jdbc:postgresql://postgres:5432/ttleaguedata
      PIPELINE_DB_USERNAME: pipeline
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      PIPELINE_PLATFORM_URL: http://api:8080
      PIPELINE_PLATFORM_API_KEY: ${ORCHESTRATOR_PLATFORM_API_KEY:?ORCHESTRATOR_PLATFORM_API_KEY is required, see deploy/.env.example}
      PIPELINE_INGEST_URL: http://ingest:8091
      PIPELINE_INGEST_API_KEY: ${PIPELINE_INGEST_API_KEY}
      # Same secret as the platform: the orchestrator validates the platform's login tokens.
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      # Scheduled runs, adaptive polling, statistics and notifications. Empty keeps each of them off.
      PIPELINE_SCHEDULE_SEASON: ${PIPELINE_SCHEDULE_SEASON:-}
      PIPELINE_SCHEDULE_ZONE: ${PIPELINE_SCHEDULE_ZONE:-Europe/Madrid}
      PIPELINE_SCHEDULE_RFETM_CRON: ${PIPELINE_SCHEDULE_RFETM_CRON:-}
      PIPELINE_SCHEDULE_BCNESA_CRON: ${PIPELINE_SCHEDULE_BCNESA_CRON:-}
      PIPELINE_SCHEDULE_FCTT_CRON: ${PIPELINE_SCHEDULE_FCTT_CRON:-}
      PIPELINE_POLLING_SOURCES: ${PIPELINE_POLLING_SOURCES:-}
      PIPELINE_STATISTICS_ZONE: ${PIPELINE_STATISTICS_ZONE:-Europe/Madrid}
      PIPELINE_MAIL_HOST: ${PIPELINE_MAIL_HOST:-}
      PIPELINE_MAIL_PORT: ${PIPELINE_MAIL_PORT:-587}
      PIPELINE_MAIL_USERNAME: ${PIPELINE_MAIL_USERNAME:-}
      PIPELINE_MAIL_PASSWORD: ${PIPELINE_MAIL_PASSWORD:-}
      PIPELINE_MAIL_STARTTLS: ${PIPELINE_MAIL_STARTTLS:-true}
      PIPELINE_MAIL_FROM: ${PIPELINE_MAIL_FROM:-}
      PIPELINE_MAIL_TO: ${PIPELINE_MAIL_TO:-}
      TZ: Europe/Madrid
    tmpfs:
      - /tmp
    volumes:
      - pipeline-artifacts:/var/lib/tt-pipeline/artifacts
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8095/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      ingest:
        condition: service_healthy
    init: true
    stop_grace_period: 40s

  proxy:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/proxy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: tt-league/proxy:${IMAGE_TAG:-local}
    ports:
      - "${PROXY_PLATFORM_PORT:-8080}:8080"
      - "${PROXY_PIPELINE_PORT:-8081}:8081"
    environment:
      TZ: Europe/Madrid
    tmpfs:
      - /tmp
      - /var/cache/nginx:mode=1777
      # The image entrypoint renders deploy/proxy/nginx.conf into this directory at start.
      - /etc/nginx/conf.d:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    stop_grace_period: 15s

networks:
  backend:

volumes:
  postgres-data:
  platform-repository:
  pipeline-artifacts:
  ingest-data:

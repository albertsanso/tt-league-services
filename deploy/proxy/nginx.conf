# Reverse proxy for the single-VM deployment (FEAT-00116). Installed as an nginx image template
# (/etc/nginx/templates/default.conf.template): at start the image substitutes ${NGINX_LOCAL_RESOLVERS} (taken from the
# container's /etc/resolv.conf) and writes /etc/nginx/conf.d/default.conf, which nginx includes at http level.
#
# - 8080: platform UI. Serves the platform SPA and proxies /api/ to the platform API.
# - 8081: pipeline UI. Serves the pipeline SPA, proxies /api/pipeline/ to the orchestrator and /api/v1/ (login and
#         session) to the platform API.
# Each SPA calls its own origin, so there is no CORS. No location routes /actuator, Swagger UI or /mcp: the
# management ports and /actuator/prometheus are reachable only on the internal network.

# The container runtime's DNS (Docker's embedded resolver, or podman's network gateway): its address differs between
# runtimes, so it is read from resolv.conf at start. Upstreams are variables so that a recreated container is picked
# up without restarting the proxy (a literal host name in proxy_pass is resolved once, at start).
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

server_tokens off;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Platform UI
server {
    listen 8080;
    server_name _;

    set $api_upstream http://api:8080;

    # add_header in a location would replace these; locations below use expires and proxy settings only.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Above the platform's 100MB upload limit; the platform answers the precise error.
        client_max_body_size 110m;
        # Stream uploads to the platform instead of spooling them to the proxy's tmpfs.
        proxy_request_buffering off;
        # The platform validates an uploaded ZIP synchronously.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass $api_upstream;
    }

    # Never served by the SPA fallback: these belong to the API, which is not reachable through the proxy here.
    location ~ ^/(actuator|mcp|swagger-ui|v3/api-docs) {
        return 404;
    }

    location /assets/ {
        root /usr/share/nginx/platform;
        expires 1y;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/platform;
        expires epoch;
        try_files $uri /index.html;
    }
}

# Pipeline UI
server {
    listen 8081;
    server_name _;

    set $api_upstream http://api:8080;
    set $orchestrator_upstream http://orchestrator:8095;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Includes the server-sent events stream: never buffer or cache it, and keep the read timeout above the
    # orchestrator's emitter timeout (PIPELINE_EVENTS_TIMEOUT, PT30M by default).
    location /api/pipeline/ {
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1900s;
        proxy_pass $orchestrator_upstream;
    }

    # Login and session of the shared platform accounts.
    location /api/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass $api_upstream;
    }

    # Never served by the SPA fallback: these belong to the API, which is not reachable through the proxy here.
    location ~ ^/(actuator|mcp|swagger-ui|v3/api-docs) {
        return 404;
    }

    location /assets/ {
        root /usr/share/nginx/pipeline;
        expires 1y;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/pipeline;
        expires epoch;
        try_files $uri /index.html;
    }
}

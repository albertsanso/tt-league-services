spring:
  application:
    name: tt-league-pipeline-orchestrator-runtime
  datasource:
    url: ${PIPELINE_DB_URL:jdbc:postgresql://localhost:5432/ttleaguedata}
    username: ${PIPELINE_DB_USERNAME:postgres}
    password: ${PIPELINE_DB_PASSWORD:admin}
  flyway:
    schemas: pipeline
    default-schema: pipeline
    create-schemas: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pipeline

server:
  port: ${PIPELINE_SERVER_PORT:8095}

tt:
  pipeline:
    platform:
      base-url: ${PIPELINE_PLATFORM_URL:jdbc:postgresql://localhost:5432/ttleaguedata}
    ingest:
      base-url: ${PIPELINE_INGEST_URL:jdbc:postgresql://localhost:5432/ttleaguedata}
      api-key: ${PIPELINE_INGEST_API_KEY}
    security:
      jwt-secret: ${JWT_SIGNING_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

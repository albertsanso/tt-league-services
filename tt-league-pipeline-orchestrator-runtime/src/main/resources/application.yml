spring:
  application:
    name: tt-league-pipeline-orchestrator-runtime
  datasource:
    url: ${PIPELINE_DB_URL:jdbc:postgresql://localhost:5432/ttleaguedata}
    username: ${PIPELINE_DB_USERNAME:postgres}
    password: ${PIPELINE_DB_PASSWORD:admin}
  flyway:
    schemas: pipeline
    default-schema: pipeline
    create-schemas: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pipeline

server:
  port: ${PIPELINE_SERVER_PORT:8095}

tt:
  pipeline:
    platform:
      base-url: ${PIPELINE_PLATFORM_URL:http://localhost:8090}
      # Service credential from the platform (FEAT-00101) with the imports:write scope.
      api-key: ${PIPELINE_PLATFORM_API_KEY}
      connect-timeout: PT10S
      # The platform validates the uploaded ZIP synchronously before answering.
      read-timeout: PT5M
      poll-interval: ${PIPELINE_IMPORT_POLL_INTERVAL:PT10S}
    ingest:
      base-url: ${PIPELINE_INGEST_URL:http://localhost:8091}
      api-key: ${PIPELINE_INGEST_API_KEY}
      connect-timeout: PT10S
      read-timeout: PT1M
      poll-interval: ${PIPELINE_INGEST_POLL_INTERVAL:PT15S}
    artifacts:
      # Existing, writable directory; packages are stored as <dir>/<source>/<season>/<runId>/ingest-<id>.zip.
      dir: ${PIPELINE_ARTIFACTS_DIR:D:/tmp/pipeline-artifacts}
    execution:
      max-retries: ${PIPELINE_MAX_RETRIES:3}
      initial-backoff: ${PIPELINE_INITIAL_BACKOFF:PT30S}
      backoff-multiplier: ${PIPELINE_BACKOFF_MULTIPLIER:2}
      max-backoff: ${PIPELINE_MAX_BACKOFF:PT5M}
      timeouts:
        # Counted from the first attempt of the step, retries and back-off included. Ingest runs one
        # ingestion at a time, so an ingest run can queue behind another source's run.
        ingest: ${PIPELINE_INGEST_TIMEOUT:PT3H}
        fetch-package: ${PIPELINE_FETCH_PACKAGE_TIMEOUT:PT10M}
        # Longer than the platform's default PT2H busy wait.
        import-job: ${PIPELINE_IMPORT_TIMEOUT:PT3H}
      max-concurrent-runs: ${PIPELINE_MAX_CONCURRENT_RUNS:3}
      recover-on-startup: ${PIPELINE_RECOVER_ON_STARTUP:true}
    security:
      # Same value as the platform's security.jwt.secret (at least 32 UTF-8 bytes).
      jwt-secret: ${JWT_SIGNING_SECRET}
      # Comma-separated browser origins allowed to call the API; empty means no CORS headers.
      cors-allowed-origins: ${PIPELINE_CORS_ALLOWED_ORIGINS:}
    triggers:
      # REJECT answers 409 for a source with an active run; QUEUE stores one pending trigger per source.
      conflict-mode: ${PIPELINE_TRIGGER_CONFLICT_MODE:REJECT}
    events:
      heartbeat-interval: ${PIPELINE_EVENTS_HEARTBEAT:PT15S}
      emitter-timeout: ${PIPELINE_EVENTS_TIMEOUT:PT30M}
      max-subscribers: ${PIPELINE_EVENTS_MAX_SUBSCRIBERS:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info

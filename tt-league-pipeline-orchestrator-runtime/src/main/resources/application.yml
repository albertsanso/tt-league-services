spring:
  application:
    name: tt-league-pipeline-orchestrator-runtime

server:
  port: ${PIPELINE_SERVER_PORT:8095}

tt:
  pipeline:
    platform:
      base-url: ${PIPELINE_PLATFORM_URL}
    ingest:
      base-url: ${PIPELINE_INGEST_URL}
      api-key: ${PIPELINE_INGEST_API_KEY}
    security:
      jwt-secret: ${JWT_SIGNING_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

[project]
name = "tt-league-ingest"
version = "0.1.0"
description = "Workspace for the table-tennis league results and matches ingestion pipelines."
requires-python = ">=3.12"
dependencies = [
    "tt-league-ingest-common",
    "tt-league-ingest-rfetm",
    "tt-league-ingest-bcnesa",
    "tt-league-ingest-fctt",
    "tt-league-ingest-cli",
    "tt-league-ingest-rest",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tt-league-ingest-common = { workspace = true }
tt-league-ingest-rfetm = { workspace = true }
tt-league-ingest-bcnesa = { workspace = true }
tt-league-ingest-fctt = { workspace = true }
tt-league-ingest-cli = { workspace = true }
tt-league-ingest-rest = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "--import-mode=importlib"

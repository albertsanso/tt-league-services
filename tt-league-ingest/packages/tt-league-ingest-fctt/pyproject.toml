[project]
name = "tt-league-ingest-fctt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tt-league-ingest-common",
]

[project.entry-points."tt_league_ingest.sources"]
fctt = "ingest_fctt.ingestor:FcttIngestor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_fctt"]

[tool.uv.sources]
tt-league-ingest-common = { workspace = true }

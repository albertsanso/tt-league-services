[project]
name = "tt-league-ingest-rest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tt-league-ingest-common",
    "tt-league-ingest-rfetm",
    "tt-league-ingest-bcnesa",
    "tt-league-ingest-fctt",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
tt-league-ingest-rest = "ingest_rest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_rest"]

[tool.uv.sources]
tt-league-ingest-common = { workspace = true }
tt-league-ingest-rfetm = { workspace = true }
tt-league-ingest-bcnesa = { workspace = true }
tt-league-ingest-fctt = { workspace = true }

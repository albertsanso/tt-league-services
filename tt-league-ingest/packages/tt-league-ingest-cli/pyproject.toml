[project]
name = "tt-league-ingest-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tt-league-ingest-common",
    "tt-league-ingest-rfetm",
    "tt-league-ingest-fcttweb",
]

[project.scripts]
tt-league-ingest = "ingest_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_cli"]

[tool.uv.sources]
tt-league-ingest-common = { workspace = true }
tt-league-ingest-rfetm = { workspace = true }
tt-league-ingest-fcttweb = { workspace = true }

[project]
name = "tt-league-ingest-rfetm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tt-league-ingest-common",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
]

[project.entry-points."tt_league_ingest.sources"]
rfetm = "ingest_rfetm.ingestor:RfetmIngestor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_rfetm"]

[tool.uv.sources]
tt-league-ingest-common = { workspace = true }

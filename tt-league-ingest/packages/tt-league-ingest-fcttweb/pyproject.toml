[project]
name = "tt-league-ingest-fcttweb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tt-league-ingest-common",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.entry-points."tt_league_ingest.sources"]
bcnesa = "ingest_fcttweb.ingestor:BcnesaIngestor"
fctt = "ingest_fcttweb.ingestor:FcttIngestor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_fcttweb"]

[tool.uv.sources]
tt-league-ingest-common = { workspace = true }
